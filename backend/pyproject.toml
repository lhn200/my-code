[project]
name = "career-assistant-backend"
version = "0.1.0"
description = "Career assistant backend: LangGraph workflow, FastAPI API, SQLite checkpoint"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "langgraph>=1.0",
    "langgraph-checkpoint-sqlite>=2.0",
    "langchain-openai>=0.2",
    "pyyaml>=6.0",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "pypdfium2>=4.30",
    "rapidocr-onnxruntime>=1.3",
    "Pillow>=10.0",
    "python-multipart>=0.0.9",
    "argon2-cffi>=21.3",
    "pyjwt>=2.8",
]

[project.optional-dependencies]
tokens = [
    "tiktoken>=0.7",
]
dev = [
    "pytest>=7",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
asyncio_mode = "auto"
